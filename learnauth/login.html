<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in · Inkwell</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

  <main class="auth-card">
    <a href="login.html" class="brand">Inkwell</a>

    <h1>Welcome back</h1>
    <p class="subtitle">Log in to continue writing.</p>

    <div id="loginError" class="message error hidden"></div>

    <form id="loginForm">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com">
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Your password">
      </div>

      <button type="button" id="loginBtn" class="btn btn-block" onclick="logUserIn()">Log in</button>
    </form>

    <p class="switch-link">New here? <a href="signup.html">Create an account</a></p>
  </main>

</body>
</html>
<script>

  let allUsers = JSON.parse(localStorage.getItem('SeptUsers26')) || []

  
function logUserIn() {
  let email = document.getElementById('email').value.trim()
  let password = document.getElementById('password').value.trim()

  let foundUser = allUsers.find((user)=> { return user.email === email })
  let foundUserIndex = allUsers.findIndex((user)=> { return user.email === email })
  if (!email || !password) {
     alert('all fields are mandatory')
  } else {

    if (!foundUser) {
       alert('user doesnt exist')
    } else if ( foundUser.password !== password) {
      alert('invalid credentials')
    } else {
      alert('log in successful')
    localStorage.setItem('currentUserIndex' , JSON.stringify(foundUserIndex))
     location.href = 'dashboard.html'
    }

  }

  
}




</script>
