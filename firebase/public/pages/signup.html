<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - ChatHub</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
</head>
<body>

  <main class="auth-page">
    <div class="auth-card">
      <a href="../index.html" class="logo">💬 ChatHub</a>
      <h2>Create an account</h2>
      <p class="subtitle">Join the group chat in seconds</p>

      <form id="signupForm">
        <div class="form-group">
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" placeholder="John Doe" required>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="At least 6 characters" required>
        </div>

        <button type="button" id="signupBtn" onclick="signUserUp()" class="btn btn-primary btn-block">Sign Up</button>
      </form>

      <p class="switch">Already have an account? <a href="login.html">Log in</a></p>
    </div>
  </main>


</body>
</html>
  <script src="../js/signup.js"> </script>
