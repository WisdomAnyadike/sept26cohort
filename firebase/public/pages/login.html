<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In - ChatHub</title>
  <link rel="stylesheet" href="../css/style.css">
    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
</head>
<body>

  <main class="auth-page">
    <div class="auth-card">
      <a href="../index.html" class="logo">💬 ChatHub</a>
      <h2>Welcome back</h2>
      <p class="subtitle">Log in to continue chatting</p>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Your password" required>
        </div>

        <button type="button" id="loginBtn" onclick="logInUser()" class="btn btn-primary btn-block">Log In</button>
      </form>

      <p class="switch">Don't have an account? <a href="signup.html">Sign up</a></p>
    </div>
  </main>

  
</body>
</html>
<script src="../js/login.js"></script>
